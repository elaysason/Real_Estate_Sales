name: Real Estate Notifier

on:
  schedule:
    - cron: '0 10 * * 6'
      timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      location:
        description: Location to check (uses the repository default when empty)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: real-estate-notifier
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, Windows, X64, sales-scraper]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: cmd
        run: |
          C:\Python311\python.exe -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run script
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
          DESIRED_LOCATION: ${{ inputs.location || vars.DESIRED_LOCATION }}
          ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: cmd
        run: .venv\Scripts\python.exe github_sales_notification.py

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-failure
          path: scrape_failure.png
          if-no-files-found: ignore

      - name: Persist scraper state
        shell: pwsh
        run: |
          (Get-Date).ToUniversalTime().ToString("o") | Set-Content .last_scrape_run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_sales.json .last_scrape_run
          git commit -m "Update scraper state [skip ci]"
          git push
